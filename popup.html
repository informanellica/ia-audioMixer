<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      max-height: 500px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1e1e2e;
    }

    .header {
      padding: 12px 16px;
      background: #181825;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #cdd6f4;
    }

    .header-icon {
      font-size: 18px;
    }

    .tab-list {
      padding: 8px 0;
    }

    .tab-item {
      padding: 10px 16px;
      border-bottom: 1px solid #313244;
      transition: background 0.15s;
    }

    .tab-item:hover {
      background: #252536;
    }

    .tab-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #bac2de;
    }

    .tab-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mute-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: #a6adc8;
      font-size: 16px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    .mute-btn:hover {
      background: #313244;
      color: #cdd6f4;
    }

    .mute-btn.muted {
      color: #f38ba8;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #313244;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #89b4fa;
      cursor: pointer;
      transition: background 0.15s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: #b4d0fb;
    }

    .volume-slider.boosted::-webkit-slider-thumb {
      background: #fab387;
    }

    .volume-value {
      font-size: 11px;
      color: #6c7086;
      width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .volume-value.boosted {
      color: #fab387;
    }

    .capture-btn {
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .capture-btn:hover {
      background: #b4d0fb;
    }

    .capture-btn.active {
      background: #a6e3a1;
    }

    .capture-btn.active:hover {
      background: #b8ebc2;
    }

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: #6c7086;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🎛</span>
    <h1>Tab Volume Mixer</h1>
  </div>
  <div id="tab-list" class="tab-list">
    <div class="empty-state" id="empty-state">
      <div style="font-size: 24px">🔇</div>
      <p>No audible tabs found</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
