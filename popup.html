<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <style>
    /* Bootstrap 5.3 color palette, driven by data-bs-theme */
    :root {
      --bs-body-bg: #fff;
      --bs-header-bg: #f8f9fa;
      --bs-body-color: #212529;
      --bs-emphasis-color: #000;
      --bs-secondary-color: #6c757d;
      --bs-tertiary-bg: #f8f9fa;
      --bs-hover-bg: #f1f3f5;
      --bs-border-color: #dee2e6;
      --bs-track-bg: #dee2e6;

      --bs-primary: #0d6efd;
      --bs-primary-hover: #0b5ed7;
      --bs-on-primary: #fff;
      --bs-success: #198754;
      --bs-success-hover: #157347;
      --bs-danger: #dc3545;
      --bs-warning: #fd7e14;
    }

    [data-bs-theme="dark"] {
      --bs-body-bg: #212529;
      --bs-header-bg: #1a1d20;
      --bs-body-color: #dee2e6;
      --bs-emphasis-color: #fff;
      --bs-secondary-color: #adb5bd;
      --bs-tertiary-bg: #2b3035;
      --bs-hover-bg: #343a40;
      --bs-border-color: #495057;
      --bs-track-bg: #495057;

      --bs-primary: #0d6efd;
      --bs-primary-hover: #3d8bfd;
      --bs-on-primary: #fff;
      --bs-success: #198754;
      --bs-success-hover: #1f9d63;
      --bs-danger: #ea868f;
      --bs-warning: #fd7e14;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      max-height: 500px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--bs-body-color);
      background: var(--bs-body-bg);
    }

    .header {
      padding: 12px 16px;
      background: var(--bs-header-bg);
      border-bottom: 1px solid var(--bs-border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--bs-emphasis-color);
      flex: 1;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--bs-border-color);
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 6px;
      color: var(--bs-secondary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    .icon-btn:hover {
      background: var(--bs-hover-bg);
      color: var(--bs-emphasis-color);
      border-color: var(--bs-secondary-color);
    }

    .icon-btn.active {
      color: var(--bs-primary);
      border-color: var(--bs-primary);
    }

    /* Settings panel */
    .settings-panel {
      padding: 10px 16px;
      background: var(--bs-tertiary-bg);
      border-bottom: 1px solid var(--bs-border-color);
    }

    .settings-panel[hidden] { display: none; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--bs-body-color);
      cursor: pointer;
    }

    .setting-select {
      appearance: auto;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 5px;
      border: 1px solid var(--bs-border-color);
      background: var(--bs-body-bg);
      color: var(--bs-body-color);
      cursor: pointer;
    }

    .setting-switch {
      appearance: none;
      -webkit-appearance: none;
      width: 34px;
      height: 18px;
      border-radius: 9px;
      background: var(--bs-track-bg);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .setting-switch::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }

    .setting-switch:checked {
      background: var(--bs-primary);
    }

    .setting-switch:checked::before {
      transform: translateX(16px);
    }

    /* Show the icon for the current theme, hide the other */
    .theme-toggle .icon-moon { display: none; }
    [data-bs-theme="dark"] .theme-toggle .icon-moon { display: inline-flex; }
    [data-bs-theme="dark"] .theme-toggle .icon-sun { display: none; }

    .tab-list {
      padding: 8px 0;
    }

    .tab-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--bs-border-color);
      transition: background 0.15s;
    }

    .tab-item:hover {
      background: var(--bs-hover-bg);
    }

    .tab-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--bs-body-color);
    }

    .tab-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mute-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: var(--bs-secondary-color);
      font-size: 16px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    .mute-btn:hover {
      background: var(--bs-hover-bg);
      color: var(--bs-emphasis-color);
    }

    .mute-btn.muted {
      color: var(--bs-danger);
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--bs-track-bg);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bs-primary);
      cursor: pointer;
      transition: background 0.15s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: var(--bs-primary-hover);
    }

    .volume-slider.boosted::-webkit-slider-thumb {
      background: var(--bs-warning);
    }

    .volume-value {
      font-size: 11px;
      color: var(--bs-secondary-color);
      width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .volume-value.boosted {
      color: var(--bs-warning);
    }

    .capture-btn {
      background: var(--bs-primary);
      color: var(--bs-on-primary);
      border: none;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .capture-btn:hover {
      background: var(--bs-primary-hover);
    }

    .capture-btn.active {
      background: var(--bs-success);
    }

    /* Hidden by default; toggled on via the settings gear */
    body.hide-capture .capture-btn { display: none; }

    .capture-btn.active:hover {
      background: var(--bs-success-hover);
    }

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--bs-secondary-color);
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 12px;
    }

    .status {
      padding: 8px 16px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--bs-secondary-color);
      background: var(--bs-tertiary-bg);
      border-bottom: 1px solid var(--bs-border-color);
    }

    .status[hidden] { display: none; }

    .footer {
      padding: 8px 16px;
      text-align: center;
      border-top: 1px solid var(--bs-border-color);
      background: var(--bs-header-bg);
    }

    .footer a {
      font-size: 11px;
      color: var(--bs-secondary-color);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: var(--bs-primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Tab Volume Mixer</h1>
    <button id="settings-toggle" class="icon-btn" title="Settings" aria-label="Settings">
      <!-- Bootstrap Icons: gear-fill -->
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
      </svg>
    </button>
    <button id="theme-toggle" class="icon-btn theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
      <!-- Bootstrap Icons: sun-fill / moon-stars-fill -->
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
      </svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
        <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097z"/>
      </svg>
    </button>
  </div>
  <div id="settings-panel" class="settings-panel" hidden>
    <label class="setting-row">
      <span>Show capture button</span>
      <input type="checkbox" id="toggle-capture-btn" class="setting-switch">
    </label>
    <label class="setting-row" style="margin-top: 10px;">
      <span>Max volume (boost)</span>
      <select id="max-volume" class="setting-select">
        <option value="100">100%</option>
        <option value="200">200%</option>
        <option value="300">300%</option>
        <option value="500">500%</option>
        <option value="600">600%</option>
      </select>
    </label>
  </div>
  <div id="status" class="status" hidden></div>
  <div id="tab-list" class="tab-list">
    <div class="empty-state" id="empty-state">
      <div style="font-size: 24px">🔇</div>
      <p>No audible tabs found</p>
    </div>
  </div>
  <div class="footer">
    <a href="https://informanellica.com" target="_blank" rel="noopener noreferrer">by informanellica</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
